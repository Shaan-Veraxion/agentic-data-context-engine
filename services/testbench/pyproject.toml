[project]
name = "adce-testbench"
version = "0.1.0"
description = "Test bench: generated test cases per agent, a runner for any agent chain, and a local web page"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-gateway", "adce-reversesql", "adce-orchestrator", "adce-agents-ingestion", "adce-agents-bi-adapters", "adce-agents-reversesql", "adce-kg-mcp", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pyyaml>=6"]

[project.scripts]
adce-bench = "testbench.cli:main"

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }
adce-kg = { workspace = true }
adce-gateway = { workspace = true }
adce-reversesql = { workspace = true }
adce-orchestrator = { workspace = true }
adce-agents-ingestion = { workspace = true }
adce-agents-bi-adapters = { workspace = true }
adce-agents-reversesql = { workspace = true }
adce-kg-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbench"]
