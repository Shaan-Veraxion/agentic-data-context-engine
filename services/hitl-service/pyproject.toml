[project]
name = "adce-hitl-service"
version = "0.1.0"
description = "Human-in-the-loop service: Ask / Queue / Gate review items, decisions recorded as facts"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-kg", "fastapi>=0.115", "psycopg[binary,pool]>=3.2"]

[tool.uv.sources]
adce-core = { workspace = true }
adce-kg = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hitl_service"]
