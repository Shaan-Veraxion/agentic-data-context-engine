[project]
name = "adce-agents-reversesql"
version = "0.1.0"
description = "Reverse-SQL agents: synthesizer (24), query checker (25), reconciler (26); report parser (21) in P3"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-qlik", "adce-reversesql"]

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }
adce-reversesql = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_reversesql"]
