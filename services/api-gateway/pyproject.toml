[project]
name = "adce-api-gateway"
version = "0.1.0"
description = "API gateway: FastAPI uploads, runs, knowledge reads; Keycloak tokens"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-kg", "adce-orchestrator", "adce-hitl-service", "adce-gateway", "adce-kg-mcp", "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pyjwt[crypto]>=2.9", "httpx>=0.27"]

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }
adce-kg = { workspace = true }
adce-gateway = { workspace = true }
adce-agents-ingestion = { workspace = true }
adce-agents-bi-adapters = { workspace = true }
adce-orchestrator = { workspace = true }
adce-hitl-service = { workspace = true }
adce-kg-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
