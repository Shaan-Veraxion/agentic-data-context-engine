[project]
name = "adce-agents-bi-adapters"
version = "0.1.0"
description = "BI source-adapter agents: BI extractor (27); script (28) and expression (29) translators in P2"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-qlik", "adce-reversesql", "adce-gateway"]

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }
adce-kg = { workspace = true }
adce-gateway = { workspace = true }
adce-reversesql = { workspace = true }
adce-agents-ingestion = { workspace = true }
adce-agents-bi-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_bi_adapters"]
