[project]
name = "adce-agents-ingestion"
version = "0.1.0"
description = "Ingestion agents: intake router (1); schema parser (2) and scope registrar (5) for Dremio arrive in phase PD"
requires-python = ">=3.12"
dependencies = ["adce-core"]

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }
adce-kg = { workspace = true }
adce-gateway = { workspace = true }
adce-agents-ingestion = { workspace = true }
adce-agents-bi-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_ingestion"]
