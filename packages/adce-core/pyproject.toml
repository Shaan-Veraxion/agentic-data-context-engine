[project]
name = "adce-core"
version = "0.1.0"
description = "ADCE contracts (BI IR, facts, events) and ports"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "duckdb>=1.1", "polars>=1.0", "boto3>=1.35",
                "opentelemetry-api>=1.27"]

[project.optional-dependencies]
telemetry = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adce_core"]
