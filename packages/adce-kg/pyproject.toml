[project]
name = "adce-kg"
version = "0.1.0"
description = "ADCE knowledge service adapter: Postgres fact log (record) + Graphiti on Neo4j (knowledge service)"
requires-python = ">=3.12"
dependencies = [
  "adce-core",
  "graphiti-core>=0.30,<0.31",
  "httpx>=0.28.1",
  "psycopg[binary,pool]>=3.2",
  "google-genai>=1.8",  # Gemini embeddings on Vertex AI
]

[tool.uv.sources]
adce-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adce_kg"]
