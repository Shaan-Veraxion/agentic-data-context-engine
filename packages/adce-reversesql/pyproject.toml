[project]
name = "adce-reversesql"
version = "0.1.0"
description = "BI IR to Dremio SQL: translation, composition, checks, validation"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-qlik", "sqlglot>=25", "pyqvd>=2.3"]

[project.scripts]
adce = "adce_reversesql.cli:main"

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adce_reversesql"]
