[project]
name = "adce-qlik"
version = "0.1.0"
description = "Qlik script, reload log and QVD readers for ADCE"
requires-python = ">=3.12"
dependencies = ["adce-core", "lark>=1.2", "sqlglot>=25"]

[tool.uv.sources]
adce-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adce_qlik"]
