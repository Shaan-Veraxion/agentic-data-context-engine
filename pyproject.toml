[project]
name = "adce"
version = "0.1.0"
description = "Agentic Dataset Context Engine (workspace root)"
requires-python = ">=3.12"
dependencies = ["adce-core", "adce-qlik", "adce-reversesql", "adce-kg", "adce-gateway"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
adce-core = { workspace = true }
adce-qlik = { workspace = true }
adce-reversesql = { workspace = true }
adce-kg = { workspace = true }
adce-gateway = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380", "alembic>=1.13", "sqlalchemy>=2.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "api_gateway.auth.require"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
markers = ["integration: needs the local compose stack (deploy/compose); skipped when it is not running"]

[tool.pyright]
include = ["packages", "services"]
pythonVersion = "3.12"
