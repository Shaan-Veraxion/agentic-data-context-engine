{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "adce.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ toJson (list $.Values.config $.Values.gateway) | sha256sum }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      securityContext: {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "adce.image" (dict "root" $ "kind" $svc.image) }}
          imagePullPolicy: {{ (index $.Values.image $svc.image).pullPolicy }}
          {{- with $svc.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- if ne $svc.image "workbench" }}
          {{- include "adce.env" $ | nindent 10 }}
          {{- end }}
          {{- with $svc.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- with $svc.health }}
          readinessProbe:
            httpGet: { path: {{ . | quote }}, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ . | quote }}, port: http }
            periodSeconds: 30
            failureThreshold: 5
          {{- end }}
          securityContext: {{- toYaml $.Values.securityContext | nindent 12 }}
          resources: {{- toYaml $svc.resources | nindent 12 }}
          {{- if and $.Values.gateway.config (ne $svc.image "workbench") }}
          volumeMounts:
            - { name: gateway-config, mountPath: /etc/adce, readOnly: true }
          {{- end }}
      {{- if and $.Values.gateway.config (ne $svc.image "workbench") }}
      volumes:
        - name: gateway-config
          configMap: { name: {{ $.Release.Name }}-gateway }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "adce.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
{{- end }}
