name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: adce, POSTGRES_PASSWORD: adce, POSTGRES_DB: adce_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U adce" --health-interval 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env: { NEO4J_AUTH: neo4j/adce-neo4j-pass }
        ports: ["7687:7687"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest   # integration tests run against the service containers; S3 ones skip without it
  bench:
    # every case of the test bench (rules, checks, validation, pack), and the gold-set applications with the model
    # answers replayed from eval/recordings: a prompt, model or rule change that breaks one fails the build.
    # Results go to Langfuse (one scored trace per case, session = commit) when the LANGFUSE_* secrets are set.
    runs-on: ubuntu-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --all-extras
      - run: mkdir -p eval/results/ci
      - name: bench (default variants)
        run: uv run adce-bench run --json eval/results/ci/bench.json --langfuse "ci-${GITHUB_SHA::8}"
      - name: gold set, model answers replayed
        run: uv run adce-bench run apps/ --ai replay --json eval/results/ci/gold-replay.json --langfuse "ci-${GITHUB_SHA::8}-gold"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-results, path: eval/results/ci/ }
  workbench:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/workbench } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm build
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: for v in values.yaml values-staging.yaml values-client.yaml; do helm lint deploy/helm/adce -f deploy/helm/adce/$v; done
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deploy/terraform/gcp init -backend=false && terraform -chdir=deploy/terraform/gcp validate
  images:
    runs-on: ubuntu-latest
    needs: [python, workbench]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/python.Dockerfile -t adce-python:ci .
      - run: docker build -f deploy/docker/workbench.Dockerfile -t adce-workbench:ci .
